<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Печкин спешит</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#9fd9ef;
    font-family:Verdana,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #err{position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;font-size:12px;
    padding:6px 10px;display:none;z-index:99;word-break:break-all}
  canvas{display:block;width:100vw;height:100vh}
  .hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 14px;color:#2b2118;font-weight:bold;font-size:15px;text-shadow:0 1px 0 rgba(255,255,255,.7);pointer-events:none}
  #toast{position:absolute;top:20%;left:50%;transform:translateX(-50%) rotate(-2deg);
    background:#fff8ec;color:#2b2118;border:2px dashed #d94f2a;
    padding:8px 14px;font-size:14px;font-weight:bold;border-radius:4px;
    opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center;
    box-shadow:0 3px 0 rgba(0,0,0,.12)}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(43,33,24,.45)}
  .card{background:#fff8ec;color:#2b2118;width:min(330px,88%);
    border:2px solid #2b2118;border-radius:6px;padding:20px 16px 16px;position:relative;
    box-shadow:6px 6px 0 rgba(43,33,24,.35);text-align:center}
  .card::before{content:"";position:absolute;top:8px;right:8px;width:32px;height:38px;
    border:2px dashed #d94f2a;border-radius:2px;
    background:repeating-linear-gradient(45deg,transparent 0 4px,rgba(217,79,42,.15) 4px 8px)}
  .card h2{font-size:18px;margin-bottom:12px}
  .card .dist{font-size:30px;font-weight:bold;margin:6px 0 2px;color:#d94f2a}
  .card .dist small{font-size:15px;color:#2b2118}
  .card .hint{font-size:14px;line-height:1.5;margin:14px 0 14px;color:#4a3b2c;font-weight:bold}
  .card button{font:inherit;font-weight:bold;font-size:15px;color:#fff8ec;
    background:#d94f2a;border:none;border-radius:6px;padding:11px 24px;cursor:pointer;
    box-shadow:0 3px 0 #9c3417}
  .card button:active{transform:translateY(2px);box-shadow:0 1px 0 #9c3417}
  #startTip{position:absolute;bottom:15%;left:0;right:0;text-align:center;color:#2b2118;
    font-size:14px;font-weight:bold;text-shadow:0 1px 0 rgba(255,255,255,.7);pointer-events:none}
</style>
</head>
<body>
<div id="err"></div>
<canvas id="cv" tabindex="0"></canvas>
<div class="hud"><span id="scoreEl">0 м</span><span id="bestEl">🏆 0 м</span></div>
<div id="toast"></div>
<div id="startTip">Тап / клик — прыжок · свайп или ↓ — пригнуться</div>
<div id="overlay"><div class="card">
  <h2 id="ovTitle">Посылка не доехала…</h2>
  <div class="dist"><span id="ovScore">0</span> <small>метров</small></div>
  <div class="hint">Сыграй ещё раз, пока мы проверяем твой платёж</div>
  <button id="againBtn" type="button">Ещё раз 🚲</button>
</div></div>
<script>
"use strict";
window.onerror=function(msg,src,line){
  var e=document.getElementById("err");
  e.style.display="block";e.textContent="Ошибка: "+msg+" (строка "+line+")";
};

/* ============ НАСТРОЙКИ ============ */
var CFG={
  BASE_SPEED:4.8,
  MAX_SPEED:12.5,
  SPEED_STEP:0.26,      /* прирост за каждое пройденное препятствие */
  EASY_OBSTACLES:3,     /* первые N — только простые (лавочка/посылка) */
  BIOME_LEN:8000,       /* длина локации: 1000 м */
  MILESTONES:{
    200:"Быстрее телеграммы! ✉️",
    500:"Проверил дважды — отправил один раз!",
    1000:"Посылка почти на месте! 📦",
    1500:"Под роспись! ✍️",
    2000:"Почтовый экспресс! 🚲",
    3000:"Легенда отделения! 🏅"
  },
  BIOME_NAMES:["🏡 Деревня","🌲 Лес","🌾 Поле","🏙 Город"]
};
/* =================================== */

var mem={};
var store={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return (k in mem)?mem[k]:null;}},
  set:function(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
};
(function(){try{
  var s=document.createElement("script");
  s.src="https://telegram.org/js/telegram-web-app.js";
  s.onload=function(){try{var t=window.Telegram&&window.Telegram.WebApp;if(t){t.ready();t.expand();}}catch(e){}};
  document.head.appendChild(s);
}catch(e){}})();
function haptic(type){try{
  var t=window.Telegram&&window.Telegram.WebApp;
  if(!t||!t.HapticFeedback)return;
  if(type==="hit")t.HapticFeedback.notificationOccurred("error");
  else t.HapticFeedback.impactOccurred("light");
}catch(e){}}

var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=0,H=0,DPR=1,GY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  GY=Math.round(H*0.78);
  if(P)P.x=Math.max(44,W*0.13);
}
window.addEventListener("resize",resize);

var S={mode:"idle",t:0,speed:CFG.BASE_SPEED,dist:0,score:0,
  best:+(store.get("pechkin_best")||0),
  shownMs:{},obstacles:[],clouds:[],birds:[],bg:[],grass:[],stones:[],
  groundX:0,spawned:0,passedCount:0,biome:0,biomeShown:-1};

var P={x:60,y:0,vy:0,w:34,h:54,duckH:30,ducking:false,onGround:true,frame:0};
var GRAV=0.62,JUMP=-12.2;
function resetPlayer(){P.x=Math.max(44,W*0.13);P.y=GY;P.vy=0;P.ducking=false;P.onGround=true;}

function curBiome(){return Math.floor(S.dist/CFG.BIOME_LEN)%4;} /* 0 деревня,1 лес,2 поле,3 город */

/* ---------- фон: генераторы объектов по локациям ---------- */
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function makeBg(x,biome){
  if(biome===0){ /* деревня: детальные избы */
    var pal=pick([["#c9805a","#8a4f33"],["#b8a06e","#7d6a42"],["#9db07a","#5f7148"],["#c4a3b0","#8a6577"]]);
    return {x:x,kind:"house",w:rnd(70,115),h:rnd(48,72),wall:pal[0],roof:pal[1],
      win:2+Math.floor(Math.random()*2),attic:Math.random()<0.6,chim:Math.random()<0.8,fence:Math.random()<0.7};
  }
  if(biome===1){ /* лес */
    if(Math.random()<0.75) return {x:x,kind:"tree",w:rnd(34,60),h:rnd(70,120),
      tone:pick(["#4f7a45","#5d8a4e","#3f6b3a"])};
    return {x:x,kind:"bush",w:rnd(26,44),h:rnd(16,26)};
  }
  if(biome===2){ /* поле */
    var r=Math.random();
    if(r<0.45) return {x:x,kind:"hay",w:rnd(36,52),h:rnd(24,34)};
    if(r<0.65) return {x:x,kind:"mill",w:56,h:rnd(80,100)};
    return {x:x,kind:"tree",w:rnd(30,44),h:rnd(55,85),tone:"#6b8f4e"};
  }
  /* город: многоэтажки */
  return {x:x,kind:"city",w:rnd(60,100),h:rnd(80,125),
    wall:pick(["#a6b4c0","#b5aca2","#aaa4bd","#9cadb8"]),
    cols:2+Math.floor(Math.random()*3),ant:Math.random()<0.4};
}
function seedScenery(){
  S.bg=[];S.grass=[];S.stones=[];S.clouds=[];S.birds=[];
  var x=10;
  while(x<W*1.6){var o=makeBg(x,curBiome());S.bg.push(o);x+=o.w+rnd(40,130);}
  for(var i=0;i<24;i++)S.grass.push({x:Math.random()*W*1.2,y:GY+6+Math.random()*(H-GY-14)});
  for(var j=0;j<12;j++)S.stones.push({x:Math.random()*W*1.2,y:GY+8+Math.random()*(H-GY-18),r:2+Math.random()*3});
  for(var c=0;c<3;c++)S.clouds.push({x:Math.random()*W,y:30+Math.random()*H*0.22,s:rnd(0.3,0.7),r:rnd(16,36)});
}

/* ---------- препятствия ----------
   прыжок: bench, pit, box, trash, mailbox
   присед: pigeon, line (верёвка с бельём)                    */
function spawn(){
  var last=S.obstacles[S.obstacles.length-1];
  var hard=Math.max(0,S.passedCount-28);
  var density=Math.max(0.62,1-hard*0.012);
  var airPx=S.speed*39.4;                       /* дистанция полного прыжка */
  var minGap=Math.max((205+S.speed*30)*density, airPx+72);
  if(last&&(W-last.x)<minGap+Math.random()*180*density)return;
  var o,r=Math.random();
  if(hard>0&&Math.random()<Math.min(0.20,hard*0.007)){
    var dr=Math.random();
    r=(dr<0.45)?0.75:(dr<0.75?0.85:0.95);      /* принудительно голубь / стая / тучка */
  }
  if(S.spawned<CFG.EASY_OBSTACLES){
    o=(Math.random()<0.5)?{type:"bench",x:W+30,w:46,h:28}:{type:"box",x:W+30,w:44,h:38};
  }
  else if(r<0.11) o={type:"bench",  x:W+30,w:46,h:28};
  else if(r<0.22) o={type:"box",    x:W+30,w:44,h:38+((Math.random()<0.4)?20:0)};
  else if(r<0.32) o={type:"trash",  x:W+30,w:36,h:40};
  else if(r<0.41) o={type:"mailbox",x:W+30,w:26,h:52};
  else if(r<0.53) o={type:"pit",    x:W+30,w:56,h:0};
  else if(r<0.61) o={type:"cat",    x:W+30,w:30,h:26,tail:0};
  else if(r<0.70) o={type:"barrel", x:W+30,w:32,h:38};
  else if(r<0.81) o={type:"pigeon", x:W+30,w:30,h:16,fy:GY-28,vx:1.5,wing:0};
  else if(r<0.91) o={type:"flock", x:W+30,w:52,fy:GY-36,h:124,wing:0};
  else            o={type:"cloud", x:W+30,w:74,fy:GY-36,h:62,puff:0};
  o.passed=false;S.spawned++;S.obstacles.push(o);
}
function hitTest(o){
  var pw=P.w-12,px_=P.x-P.w/2+6;
  var ph=P.ducking?P.duckH:P.h,py=P.y-ph;
  if(o.type==="pit"){ /* яма опасна только когда стоишь на земле */
    return P.onGround && px_+pw>o.x+8 && px_<o.x+o.w-8;
  }
  var oy,oh;
  if(o.type==="pigeon"||o.type==="flock"||o.type==="cloud"){oy=o.fy-o.h;oh=o.h;}
  else{oy=GY-o.h;oh=o.h;}
  return px_<o.x+o.w-6&&px_+pw>o.x+6&&py<oy+oh-6&&py+ph>oy+6;
}

var lastKeyT=0;
function debounced(){var n=Date.now();if(n-lastKeyT<30)return false;lastKeyT=n;return true;}
function doJump(){if(S.mode!=="run")return;if(!debounced())return;if(P.onGround&&!P.ducking){P.vy=JUMP;P.onGround=false;haptic("jump");}}
function doDuck(on){if(S.mode!=="run")return;if(P.onGround)P.ducking=on;else if(!on)P.ducking=false;}

var pStartY=null,pTimer=null;
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();
  try{cv.focus();}catch(ex){}
  if(S.mode==="idle"){start();return;}
  if(S.mode!=="run")return;
  pStartY=e.clientY;
  pTimer=setTimeout(function(){doJump();pTimer=null;},70);
});
cv.addEventListener("pointermove",function(e){
  if(pStartY===null)return;
  if(e.clientY-pStartY>28){
    if(pTimer){clearTimeout(pTimer);pTimer=null;}
    doDuck(true);
  }
});
function pointerUp(){
  if(pTimer){clearTimeout(pTimer);pTimer=null;doJump();}
  doDuck(false);pStartY=null;
}
cv.addEventListener("pointerup",pointerUp);
cv.addEventListener("pointercancel",pointerUp);
function onKeyDown(e){
  if(e.repeat)return;
  var c=e.code||e.key;
  if(c==="Space"||c===" "||c==="ArrowUp"||c==="Up"){e.preventDefault();if(S.mode==="idle")start();else if(S.mode==="over"){document.getElementById("overlay").style.display="none";start();}else doJump();}
  if(c==="ArrowDown"||c==="Down"){e.preventDefault();doDuck(true);}
}
function onKeyUp(e){var c=e.code||e.key;if(c==="ArrowDown"||c==="Down")doDuck(false);}
window.addEventListener("keydown",onKeyDown,true);
document.addEventListener("keydown",onKeyDown,true);
cv.addEventListener("keydown",onKeyDown,true);
window.addEventListener("keyup",onKeyUp,true);
document.addEventListener("keyup",onKeyUp,true);
cv.addEventListener("keyup",onKeyUp,true);
document.getElementById("againBtn").addEventListener("click",function(){
  this.blur();                                   /* снять фокус, иначе пробел жмёт кнопку, а не прыжок */
  document.getElementById("overlay").style.display="none";start();
});

function start(){
  S.mode="run";S.t=0;S.speed=CFG.BASE_SPEED;S.dist=0;S.score=0;S.spawned=0;S.passedCount=0;
  S.shownMs={};S.obstacles=[];S.biomeShown=-1;
  resetPlayer();seedScenery();
  document.getElementById("startTip").style.display="none";
}
function gameOver(){
  S.mode="over";haptic("hit");
  if(S.score>S.best){S.best=S.score;store.set("pechkin_best",String(S.best));}
  document.getElementById("bestEl").textContent="🏆 "+S.best+" м";
  document.getElementById("ovScore").textContent=S.score;
  document.getElementById("overlay").style.display="flex";
}
var toastT=null;
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;el.style.opacity=1;
  clearTimeout(toastT);toastT=setTimeout(function(){el.style.opacity=0;},1600);
}

function step(dtms){
  if(S.mode!=="run")return;
  S.t+=dtms;
  var k=dtms/16.7,dx=S.speed*k;
  S.dist+=dx;S.groundX=(S.groundX+dx)%40;
  S.score=Math.floor(S.dist/8);
  document.getElementById("scoreEl").textContent=S.score+" м";
  for(var m in CFG.MILESTONES){if(S.score>=+m&&!S.shownMs[m]){S.shownMs[m]=1;toast(CFG.MILESTONES[m]);}}
  var b=curBiome();
  if(b!==S.biomeShown&&S.dist>200){
    S.biomeShown=b;toast(CFG.BIOME_NAMES[b]);
    for(var z=0;z<S.bg.length;z++){          /* невидимые справа — сразу в новую локацию */
      if(S.bg[z].x>W+10)S.bg[z]=makeBg(S.bg[z].x,b);
    }
  }
  else if(S.biomeShown===-1)S.biomeShown=b;
  if(!P.onGround){P.vy+=GRAV*k;P.y+=P.vy*k;if(P.y>=GY){P.y=GY;P.vy=0;P.onGround=true;}}
  P.frame+=dtms;
  spawn();
  var i,o;
  for(i=0;i<S.obstacles.length;i++){o=S.obstacles[i];o.x-=dx;
    if(o.type==="pigeon"){o.x-=1.5*k;o.wing+=dtms;}
    if(o.type==="cat"){o.tail+=dtms;}
    if(o.type==="flock"){o.wing+=dtms;}
    if(o.type==="cloud"){o.puff+=dtms;}
    if(!o.passed&&o.x+o.w<P.x-P.w/2){o.passed=true;S.passedCount++;S.speed=Math.min(CFG.MAX_SPEED,S.speed+CFG.SPEED_STEP);}}
  while(S.obstacles.length&&S.obstacles[0].x<-90)S.obstacles.shift();
  for(i=0;i<S.obstacles.length;i++){if(hitTest(S.obstacles[i]))return gameOver();}
  /* фон-параллакс + пересев по текущей локации */
  for(i=0;i<S.bg.length;i++){var bo=S.bg[i];bo.x-=dx*0.40;
    if(bo.x+bo.w<-30){var mx=0;
      for(var q=0;q<S.bg.length;q++)mx=Math.max(mx,S.bg[q].x+S.bg[q].w);
      S.bg[i]=makeBg(mx+rnd(40,130),curBiome());}}
  for(i=0;i<S.grass.length;i++){var gg=S.grass[i];gg.x-=dx;if(gg.x<-10){gg.x=W+Math.random()*60;gg.y=GY+6+Math.random()*(H-GY-14);}}
  for(i=0;i<S.stones.length;i++){var st=S.stones[i];st.x-=dx;if(st.x<-10){st.x=W+Math.random()*60;st.y=GY+8+Math.random()*(H-GY-18);}}
  for(i=0;i<S.clouds.length;i++)S.clouds[i].x-=S.clouds[i].s*k*(0.4+S.speed*0.12);
  S.clouds=S.clouds.filter(function(c){return c.x>-90;});
  if(S.clouds.length<3&&Math.random()<0.012)
    S.clouds.push({x:W+50,y:30+Math.random()*H*0.22,s:rnd(0.3,0.7),r:rnd(16,36)});
  if(S.birds.length<2&&Math.random()<0.004)
    S.birds.push({x:W+30,y:40+Math.random()*H*0.18,wing:0});
  for(i=0;i<S.birds.length;i++){S.birds[i].x-=k*1.6;S.birds[i].wing+=dtms;}
  S.birds=S.birds.filter(function(bd){return bd.x>-30;});
}

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function drawPlayer(){
  var duck=P.ducking,bx=P.x,by=P.y;         /* bx — центр, by — уровень стоп */
  var f=Math.floor(P.frame/100)%4;
  var bob=P.onGround&&!duck?[0,-1.5,0,-1.5][f]:0;
  var skin="#e8b58b",skinD="#dba270",coat="#3a5f8a",coatD="#2e4d72",
      cap="#274363",bag="#a5652f",bagD="#7d4c21",mus="#4a3320",boot="#241d15";
  function limb(x1,y1,x2,y2,wd,col){
    ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  }
  function ell(x,y,rx,ry,col,rot){
    ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,7);ctx.fill();
  }
  if(!duck){
    /* ноги: 4 фазы бега, скруглённые */
    var la=[[-6,-2],[-2,-4],[2,-1],[-2,-4]][f];
    var lb=[[6,-1],[2,-4],[-5,-2],[2,-4]][f];
    limb(bx-3,by-20,bx+la[0],by+la[1]-2,7,"#27364a");
    limb(bx+3,by-20,bx+lb[0],by+lb[1]-2,7,"#1f2c3d");
    ell(bx+la[0]+2,by+la[1]-1,5,3,boot);
    ell(bx+lb[0]+2,by+lb[1]-1,5,3,boot);
    /* пухлое тело-шинель */
    ell(bx,by-33+bob,16,18,coat);
    ell(bx-5,by-30+bob,11,14,"#41689a");                 /* мягкий свет на груди */
    /* ремень дугой по пузу */
    ctx.strokeStyle="#22384f";ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(bx,by-40+bob,16,0.5,2.64);ctx.stroke();
    ctx.fillStyle="#d9c46a";ctx.fillRect(bx-2,by-26+bob,4,4);  /* пряжка */
    ell(bx-3,by-38+bob,1.6,1.6,"#d9c46a");                /* пуговицы */
    ell(bx-3,by-31+bob,1.6,1.6,"#d9c46a");
    /* ремень сумки через плечо + сумка */
    ctx.strokeStyle=bagD;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(bx-9,by-47+bob);ctx.lineTo(bx+12,by-28+bob);ctx.stroke();
    ctx.fillStyle=bag;
    ctx.beginPath();ctx.moveTo(bx+7,by-30+bob);
    ctx.quadraticCurveTo(bx+7,by-34+bob,bx+11,by-34+bob);
    ctx.lineTo(bx+18,by-34+bob);
    ctx.quadraticCurveTo(bx+22,by-34+bob,bx+22,by-30+bob);
    ctx.lineTo(bx+22,by-22+bob);
    ctx.quadraticCurveTo(bx+22,by-18+bob,bx+18,by-18+bob);
    ctx.lineTo(bx+11,by-18+bob);
    ctx.quadraticCurveTo(bx+7,by-18+bob,bx+7,by-22+bob);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=bagD;ctx.fillRect(bx+7,by-34+bob,15,3); /* клапан */
    ctx.fillStyle="#f4ead2";ctx.fillRect(bx+10,by-24+bob,8,5); /* конверт */
    ctx.strokeStyle="#c9b68d";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bx+10,by-24+bob);ctx.lineTo(bx+14,by-21+bob);ctx.lineTo(bx+18,by-24+bob);ctx.stroke();
    /* рука-маятник */
    var sw2=(f%2)?5:-4;

    ctx.beginPath();ctx.arc(o.x+o.w-9,GY-22,7.5,0,7);ctx.fill();   /* голова */

    var hz=ctx.createLinearGradient(0,GY-o.h,0,GY);
    hz.addColorStop(0,"rgba(190,215,230,.30)");hz.addColorStop(1,"rgba(190,215,230,.05)");
    ctx.fillStyle=hz;ctx.fillRect(o.x,GY-o.h,o.w,o.h);
  }
}
function drawScenery(){
  ctx.fillStyle="#ffe9a8";ctx.beginPath();ctx.arc(W*0.82,H*0.14,26,0,7);ctx.fill();
  ctx.fillStyle="#fff3c9";ctx.beginPath();ctx.arc(W*0.82,H*0.14,18,0,7);ctx.fill();
  var i;
  ctx.strokeStyle="rgba(60,60,70,.55)";ctx.lineWidth=2;
  for(i=0;i<S.birds.length;i++){var b=S.birds[i],f=Math.floor(b.wing/160)%2?3:-1;
    ctx.beginPath();ctx.moveTo(b.x-6,b.y);ctx.quadraticCurveTo(b.x-2,b.y+f,b.x,b.y);
    ctx.quadraticCurveTo(b.x+2,b.y+f,b.x+6,b.y);ctx.stroke();}
  ctx.fillStyle="rgba(255,255,255,.88)";
  for(i=0;i<S.clouds.length;i++){var c=S.clouds[i];ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,7);ctx.arc(c.x+c.r*0.9,c.y+4,c.r*0.7,0,7);
    ctx.arc(c.x-c.r*0.8,c.y+5,c.r*0.6,0,7);ctx.fill();}
  for(i=0;i<S.bg.length;i++)drawBg(S.bg[i]);
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,GY);
  g.addColorStop(0,"#9fd9ef");g.addColorStop(0.7,"#cdeee0");g.addColorStop(1,"#e8f5d5");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,GY);
  drawScenery();
  px(0,GY,W,H-GY,"#c9a36b");
  ctx.strokeStyle="#8a6a3d";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GY);ctx.lineTo(W,GY);ctx.stroke();
  var x;
  for(x=-S.groundX;x<W;x+=40)px(x,GY+10,14,3,"#b18e57");
  var i;
  for(i=0;i<S.stones.length;i++){var st=S.stones[i];
    ctx.fillStyle="#ab8756";ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fill();}
  for(i=0;i<S.grass.length;i++){var gr=S.grass[i];
    px(gr.x,gr.y-5,2,5,"#7d9b4e");px(gr.x+3,gr.y-7,2,7,"#8fae5c");px(gr.x+6,gr.y-4,2,4,"#7d9b4e");}
  for(i=0;i<S.obstacles.length;i++)drawObstacle(S.obstacles[i]);
  drawPlayer();
  if(S.mode==="idle"){
    ctx.fillStyle="rgba(43,33,24,.8)";ctx.font="bold 21px Verdana";ctx.textAlign="center";
    ctx.fillText("📮 Печкин спешит",W/2,H*0.30);
    ctx.font="14px Verdana";
    ctx.fillText("Догоните уехавший велосипед!",W/2,H*0.30+26);
    ctx.fillText("Нажмите, чтобы начать",W/2,H*0.30+50);
    ctx.textAlign="left";
  }
}
var prev=performance.now();
function loop(now){
  var dt=Math.min(50,now-prev);prev=now;
  step(dt);draw();
  requestAnimationFrame(loop);
}
resize();
try{cv.focus();}catch(ex){}
seedScenery();
document.getElementById("bestEl").textContent="🏆 "+S.best+" м";
resetPlayer();
requestAnimationFrame(loop);
</script>
